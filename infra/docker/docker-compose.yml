# Local development: Postgres and Redis. The API, worker and web app run on the host (see README).
# Ports are bound to 127.0.0.1: Docker's firewall rules bypass ufw, so "5432:5432" would let anyone
# on the same Wi-Fi reach the database (and these are simple dev passwords).
services:
  postgres:
    image: postgres:16
    container_name: papyris-postgres
    environment:
      POSTGRES_USER: papyris
      POSTGRES_PASSWORD: papyris
      POSTGRES_DB: papyris
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papyris"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: papyris-redis
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data:
